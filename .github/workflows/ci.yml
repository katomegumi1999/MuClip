name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. 代码风格：全仓库 rustfmt 规范化
  lint:
    name: Format & Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: clippy (correctness lints are fatal)
        run: cargo clippy --all-targets -- -D clippy::correctness

  # 2. 全量单元测试：含协议/加密的对抗性测试（篡改、截断、错误 PIN、nonce 唯一性）
  test:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  # 3. Release 产物：验证 LTO + panic=abort + strip 发布配置可用，并产出 DLL
  release-build:
    name: Release Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Upload muclip_core.dll
        uses: actions/upload-artifact@v4
        with:
          name: muclip-core-dll
          path: target/release/muclip_core.dll
          if-no-files-found: warn

  # 4. SQLCipher 静态加密：这条分支要现场编译 OpenSSL，构建期依赖 perl。
  #    GitHub 的 windows runner 预装 Strawberry Perl，本地开发机未必有，
  #    所以把这条链路的验证放到 CI，避免「代码写了但从没编过」。
  sqlcipher:
    name: SQLCipher Build & Encryption Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # 与默认构建分开缓存，避免 bundled/plain 与 sqlcipher 产物互相污染
          key: sqlcipher
      - name: Check perl (openssl-src build dependency)
        run: perl -v
      - name: Clippy with sqlcipher feature
        run: cargo clippy --all-targets --no-default-features --features sqlcipher -- -D clippy::correctness
      - name: Run tests (includes on-disk encryption cases)
        run: cargo test --no-default-features --features sqlcipher
      # 顺手把带加密的 dll 传上来：宿主（小沐 OCR 等）可以直接下载替换，
      # 不必为了编这一条分支在自己机器上装 perl。
      - name: Build release (encryption enabled)
        run: cargo build --release --no-default-features --features sqlcipher
      - name: Upload muclip_core.dll (sqlcipher build)
        uses: actions/upload-artifact@v4
        with:
          name: muclip-core-dll-sqlcipher
          path: target/release/muclip_core.dll
          if-no-files-found: warn
