name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. 代码风格：全仓库 rustfmt 规范化
  lint:
    name: Format & Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: clippy (correctness lints are fatal)
        run: cargo clippy --all-targets -- -D clippy::correctness

  # 2. 全量单元测试：含协议/加密的对抗性测试（篡改、截断、错误 PIN、nonce 唯一性）
  test:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  # 3. Release 产物：验证 LTO + panic=abort + strip 发布配置可用，并产出 DLL
  release-build:
    name: Release Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Upload muclip_core.dll
        uses: actions/upload-artifact@v4
        with:
          name: muclip-core-dll
          path: target/release/muclip_core.dll
          if-no-files-found: warn
